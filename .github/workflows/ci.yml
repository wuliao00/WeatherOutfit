name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint / Unit Test / Assemble
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      # local.properties 不进版本库，CI 上必须自己写出来：
      # 一是 SDK 路径，二是天气凭证。不配 secrets 时退回内置公共凭证，
      # 构建照样过，但线上必然被限流——所以这里显式打印用的是哪一种。
      - name: Write local.properties
        env:
          WEATHER_API_ID: ${{ secrets.WEATHER_API_ID }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: |
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "WEATHER_API_ID=${WEATHER_API_ID:-88888888}"
            echo "WEATHER_API_KEY=${WEATHER_API_KEY:-88888888}"
          } > local.properties
          if [ -z "$WEATHER_API_ID" ]; then
            echo "::warning::未配置 WEATHER_API_ID/KEY，使用公共演示凭证（共享频次，不可用于发布）"
          fi

      - name: Lint, Test and Assemble Debug
        run: ./gradlew lint testDebugUnitTest assembleDebug

      # release 签名依赖 secrets；未配置时产出未签名包，
      # 用来验证 R8 混淆与资源收缩没有裁坏功能，而不是让 CI 直接变红。
      - name: Detect release keystore secret
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "present=$([ -n "$RELEASE_KEYSTORE_BASE64" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # 这一步只报「值的形状」不报内容，且用 ::notice::/::error:: 发成 annotation ——
      # annotation 是匿名可读的，而 job 日志要登录。2026-10-13 那次 Decode 失败就是靠
      # 「失败在哪一步」定位的，但那一步的 stderr 我读不到；加上形状后一眼能判是粘贴脏了还是别的。
      - name: Keystore secret shape (never prints content)
        if: steps.keystore.outputs.present == 'true'
        env:
          B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          v="$B64"
          len=${#v}
          first4=${v:0:4}
          has_cr=$([ "$v" != "$(printf %s "$v" | tr -d '\r')" ] && echo yes || echo no)
          has_space=$([ "$v" != "$(printf %s "$v" | tr -d '[:space:]')" ] && echo yes || echo no)
          tail4=$(printf %s "$v" | tail -c 4)
          if [ "$has_cr" = "yes" ] || [ "$has_space" = "yes" ] || [ "$len" -lt 1000 ]; then
            echo "::error::keystore secret 形状可疑（长度干净时应为 5792）：len=$len first4=$first4 tail4=$tail4 cr=$has_cr space=$has_space"
          else
            echo "::notice::keystore secret 形状：len=$len first4=$first4 tail4=$tail4 cr=$has_cr space=$has_space"
          fi

      # 容忍粘贴带换行/空白：先把空白全删掉再解码（GNU base64 本身容错换行，但对 BOM/多余文本不行）
      - name: Decode release keystore
        if: steps.keystore.outputs.present == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "${{ runner.temp }}/release.jks"
          echo "decoded bytes: $(wc -c < "${{ runner.temp }}/release.jks")"

      - name: Assemble Release
        env:
          RELEASE_KEYSTORE_PATH: ${{ steps.keystore.outputs.present == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

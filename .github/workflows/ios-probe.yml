name: iOS probe

# 与主 CI 完全分开：主 CI 跑在 ubuntu 上构建 Android，这里跑在 macOS 上只为回答
# 「玻璃那套代码能不能为 iOS 编出来」以及「哪个版本组合可行」。
# 探针挂了不会挡住发版。

on:
  push:
    paths:
      - "ios-probe/**"
      # shared 是真正要长期保障的模块，它或根构建配置一变就要重编 iOS
      - "shared/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/libs.versions.toml"
      - ".github/workflows/ios-probe.yml"
  pull_request:
    paths:
      - "ios-probe/**"
      - "shared/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/libs.versions.toml"
  workflow_dispatch:

jobs:
  # 真正的领域层（shared）能不能为 iOS 编出来 —— 这才是迁移的实际保障。
  # 探针只证明「玻璃那套代码理论上可编」，这个 job 证明「仓库里现在这份代码可编」，
  # 所以任何人往 shared/commonMain 里加一个 Android-only 依赖，这里就会红。
  shared-ios:
    name: Compile :shared for iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle + Kotlin/Native
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.konan
          key: shared-ios-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'shared/**', 'build.gradle.kts', 'settings.gradle.kts') }}
          restore-keys: shared-ios-${{ runner.os }}-

      - name: Compile shared for iosArm64 + iosSimulatorArm64
        # 诊断已经给出硬事实（run 36130854067 的 post-failure 那一步）：
        # 构建**失败之后** ~/.konan 依然完全不存在，而 gradle 缓存里
        # kotlin-compiler-embeddable-2.1.0.jar 是 58,801,389 字节的完整文件。
        # 也就是：K/N 预置包根本没被安装过（不是装坏、不是下载截断），
        # 而 KotlinNativeToolRunner.runInProcess 直接去那个不存在的路径反射加载
        # MainKt，于是 CNFE + "Can't find env_blacklist file at …"。
        # 本机 :shared:tasks --all 也确认 KGP 2.1.0 没有 downloadKotlinNativeDistribution
        # 这类任务可调（只有 setupLldbScript 带 konan），安装是懒的、由编译任务触发。
        #
        # 所以这一轮试关掉 2.1 的 native toolchain（默认从 maven 解析
        # kotlin-native-prebuilt 制品 —— 缓存里连 *native-prebuilt* 都没有，说明那次
        # 解析什么都没拿到），回到"从 download.jetbrains.com 装到 ~/.konan"的老路径。
        # 下一步的诊断会告诉我们 ~/.konan 到底有没有被建出来。
        run: ./gradlew :shared:compileKotlinIosArm64 :shared:compileKotlinIosSimulatorArm64 --no-daemon --stacktrace -Pkotlin.native.toolchain.enabled=false

      # 一次性诊断，查清就删。已经排除的假设（都是被自己的实验推翻的，不是想当然）：
      # 1) "下载坏了" → rm -rf ~/.konan + --refresh-dependencies 重试，47 秒后同一个错；
      # 2) "预置包在本次构建里装晚了" → 保留 ~/.konan 重跑，第二次 11 秒就红，同一个错；
      # 3) "runner 镜像自带残缺的 ~/.konan" → 构建前查，~/.konan 压根不存在（真冷启动），
      #    磁盘还剩 95Gi，gradle 缓存里也没有任何 *native-prebuilt* 制品。
      # 现在要的是**失败之后**磁盘上到底长什么样：预置包目录在不在、多大、
      # tools/env_blacklist 与 kotlin/lib/*.jar 有没有、那份 tar.gz 落在哪、多大。
      # 这几种可能各自对应不同的修法，不能再靠猜。
      - name: Diagnose Kotlin/Native distribution state (post-failure)
        if: failure()
        run: |
          set +e   # Actions 默认 bash -e，诊断里 ls/find 找不到东西是预期的
          echo "=== ~/.konan 顶层 ==="
          ls -la ~/.konan
          echo "=== 每个目录多大 ==="
          du -sh ~/.konan/* 2>/dev/null
          echo "=== 预置包内部结构 ==="
          for d in ~/.konan/kotlin-native-prebuilt-*; do
            [ -d "$d" ] || continue
            echo "--- $d"
            ls -la "$d"
            echo "  [tools]"; ls -la "$d/tools"
            echo "  [env_blacklist 在不在]"; ls -la "$d/tools/env_blacklist"
            echo "  [kotlin/lib 条目数]"; ls "$d/kotlin/lib" | wc -l
            echo "  [kotlin/lib 前 20 个]"; ls -la "$d/kotlin/lib" | head -20
            echo "  [有没有 MainKt 所在的 jar]"; ls -la "$d/kotlin/lib" | grep -iE "compiler|utilities"
          done
          echo "=== 完成标记 ==="
          ls -la ~/.konan | grep -iE "complete|lock"
          echo "=== gradle 缓存里的 kotlin 编译器 jar 与 K/N 包 ==="
          find ~/.gradle/caches -iname "*native-prebuilt*" -o -iname "kotlin-compiler-embeddable*.jar" 2>/dev/null | head -20
          echo "=== 上述文件的大小 ==="
          find ~/.gradle/caches \( -iname "*native-prebuilt*" -o -iname "kotlin-compiler-embeddable*.jar" \) -exec ls -la {} \; 2>/dev/null | head -20

      # 编译通过 ≠ 能跑。这一层的失败模式全是运行期的：Room 没挂上驱动、schema 校验不过、
      # 生成的 Impl 找不到、flow 不推送；偏好的类型标签写错也只是"值悄悄漂移"。
      # 本机是 Windows，iOS target 压根不参与编译，所以模拟器测试是唯一能拿到
      # 「iOS 上真跑过」证据的地方 —— 没有这一步，iOS 侧的所有结论都只是"编译器没意见"。
      - name: Run shared tests on the iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test --no-daemon --stacktrace

      # 失败时把逐用例结果留成制品，否则只能看到 "Compilation finished with errors" 那一行
      - name: Upload iOS test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-test-results
          path: shared/build/test-results/
          if-no-files-found: ignore

  version-matrix:
    name: kotlin ${{ matrix.kotlin }} / compose ${{ matrix.compose }}
    runs-on: macos-latest
    # 矩阵里某一档失败是「信息」而不是「事故」：我们要的是完整的答案表，
    # 所以不许 fail-fast，也不让单个失败把整条流水线变红。
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # 最关键的一档：App 现在就是 Kotlin 2.1.0 + Compose 1.8.3。
          # 这一档过了，KMP 迁移就不需要动 Android 的任何工具链。
          - kotlin: "2.1.0"
            compose: "1.8.2"
          # 退一步：只小升 Kotlin，仍然不碰 Compose 代际
          - kotlin: "2.2.20"
            compose: "1.8.2"
          # 已知能过的一档，用来确认「失败是版本问题，不是探针本身坏了」
          - kotlin: "2.4.20"
            compose: "1.12.0"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle + Kotlin/Native
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.konan
          key: kmp-${{ runner.os }}-k${{ matrix.kotlin }}-c${{ matrix.compose }}
          restore-keys: kmp-${{ runner.os }}-

      # 两个 target 都编：只编模拟器会漏掉真机 arm64 才暴露的问题，反之亦然
      - name: Compile iosArm64 + iosSimulatorArm64
        working-directory: ios-probe
        run: |
          ../gradlew compileKotlinIosArm64 compileKotlinIosSimulatorArm64 \
            --no-daemon --stacktrace \
            -PkotlinVersion=${{ matrix.kotlin }} -PcomposeVersion=${{ matrix.compose }}

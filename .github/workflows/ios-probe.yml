name: iOS probe

# 与主 CI 完全分开：主 CI 跑在 ubuntu 上构建 Android，这里跑在 macOS 上只为回答
# 「玻璃那套代码能不能为 iOS 编出来」以及「哪个版本组合可行」。
# 探针挂了不会挡住发版。

on:
  push:
    paths:
      - "ios-probe/**"
      # shared 是真正要长期保障的模块，它或根构建配置一变就要重编 iOS
      - "shared/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/libs.versions.toml"
      - ".github/workflows/ios-probe.yml"
  pull_request:
    paths:
      - "ios-probe/**"
      - "shared/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/libs.versions.toml"
  workflow_dispatch:

jobs:
  # 真正的领域层（shared）能不能为 iOS 编出来 —— 这才是迁移的实际保障。
  # 探针只证明「玻璃那套代码理论上可编」，这个 job 证明「仓库里现在这份代码可编」，
  # 所以任何人往 shared/commonMain 里加一个 Android-only 依赖，这里就会红。
  shared-ios:
    name: Compile :shared for iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle + Kotlin/Native
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.konan
          key: shared-ios-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'shared/**', 'build.gradle.kts', 'settings.gradle.kts') }}
          restore-keys: shared-ios-${{ runner.os }}-

      # 一次性诊断（查清 kspKotlinIosArm64 的 MainKt CNFE 后删掉）。
      # 已排除两个假设：不是"下载坏了"（rm -rf ~/.konan + --refresh-dependencies 重试，
      # 47 秒后报一模一样的错），也不是"预置包在本次构建里装晚了"（保留 ~/.konan 重跑一次，
      # 第二次 11 秒就红，同一处）。
      # 现在的判据：失败时日志里有 "Can't find env_blacklist file at
      # /Users/runner/.konan/kotlin-native-prebuilt-macos-aarch64-2.1.0/tools/env_blacklist"，
      # 而所有绿的 run 里这句出现 0 次 —— 说明磁盘上那份预置包确实是缺文件的，
      # 且 KGP 没有重新下载它（47 秒不够下 1GB）。这一步就是看：
      # runner 镜像是不是本来就带了一个残缺的 ~/.konan，让 KGP 误以为"已经装好了"。
      - name: Diagnose Kotlin/Native distribution state
        run: |
          set +e   # Actions 默认用 bash -e，诊断里的 ls/find 找不到东西是正常的，别让它中断这一步
          echo "=== df -h（磁盘满也会造成解包缺文件）==="
          df -h /Users/runner || true
          echo "=== ~/.konan 顶层 ==="
          ls -la ~/.konan || echo "~/.konan 不存在（真冷启动）"
          echo "=== 预置包目录里到底有什么 ==="
          for d in ~/.konan/kotlin-native-prebuilt-*; do
            [ -d "$d" ] || continue
            echo "--- $d"; du -sh "$d"; ls -la "$d"
            echo "  tools/:"; ls -la "$d/tools" 2>&1 | head -5
            echo "  kotlin/lib/ 里的 jar:"; ls -la "$d/kotlin/lib" 2>&1 | head -8
            echo "  完成标记:"; ls -la "$d".* 2>/dev/null; ls -la ~/.konan | grep -i complete || echo "  （无 .complete 标记）"
          done
          echo "=== gradle 缓存里的 kotlin-native-prebuilt 制品（大小对不对）==="
          find ~/.gradle/caches/modules-2 -iname "*native-prebuilt*" -size -1c 2>/dev/null | head -5
          find ~/.gradle/caches/modules-2 -iname "*native-prebuilt*" 2>/dev/null | head -8

      - name: Compile shared for iosArm64 + iosSimulatorArm64
        run: |
          if ! ./gradlew :shared:compileKotlinIosArm64 :shared:compileKotlinIosSimulatorArm64 --no-daemon --stacktrace; then
            # 冷缓存下的第二次调用。2026-09-25 合并到 main 后这个 job 连着红，报的是
            #   :shared:kspKotlinIosArm64 -> java.lang.ClassNotFoundException:
            #       org.jetbrains.kotlin.cli.utilities.MainKt
            # 栈顶是 KotlinNativeToolRunner.runInProcess —— 它从 ~/.konan 那份预置包里
            # 反射加载 MainKt，包缺文件就报 CNFE。
            #
            # 为什么分支绿、main 红：GitHub 的 Actions 缓存按分支隔离，分支上存的
            # shared-ios-* 缓存不给 main 用（仓库 15 条缓存里 4 条 shared-ios-* 全挂在
            # refs/heads/feat/kmp-network 下，main 一条都没有），日志里就是那句
            # "Cache not found for input keys: shared-ios-macOS-c2bc8a18…"。
            #
            # 这里保留 ~/.konan 重跑一次（上一版先 rm -rf 再 --refresh-dependencies，
            # 47 秒后同样报 MainKt，说明删了也是从同一个来源重建、照样缺文件）。
            # 还红就按上面那步的诊断结果改，不再盲试第三次。
            echo "::warning::首次编译失败，保留 ~/.konan 重跑一次（诊断信息见上一步）"
            ./gradlew :shared:compileKotlinIosArm64 :shared:compileKotlinIosSimulatorArm64 --no-daemon --stacktrace
          fi

      # 编译通过 ≠ 能跑。这一层的失败模式全是运行期的：Room 没挂上驱动、schema 校验不过、
      # 生成的 Impl 找不到、flow 不推送；偏好的类型标签写错也只是"值悄悄漂移"。
      # 本机是 Windows，iOS target 压根不参与编译，所以模拟器测试是唯一能拿到
      # 「iOS 上真跑过」证据的地方 —— 没有这一步，iOS 侧的所有结论都只是"编译器没意见"。
      - name: Run shared tests on the iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test --no-daemon --stacktrace

      # 失败时把逐用例结果留成制品，否则只能看到 "Compilation finished with errors" 那一行
      - name: Upload iOS test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-test-results
          path: shared/build/test-results/
          if-no-files-found: ignore

  version-matrix:
    name: kotlin ${{ matrix.kotlin }} / compose ${{ matrix.compose }}
    runs-on: macos-latest
    # 矩阵里某一档失败是「信息」而不是「事故」：我们要的是完整的答案表，
    # 所以不许 fail-fast，也不让单个失败把整条流水线变红。
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # 最关键的一档：App 现在就是 Kotlin 2.1.0 + Compose 1.8.3。
          # 这一档过了，KMP 迁移就不需要动 Android 的任何工具链。
          - kotlin: "2.1.0"
            compose: "1.8.2"
          # 退一步：只小升 Kotlin，仍然不碰 Compose 代际
          - kotlin: "2.2.20"
            compose: "1.8.2"
          # 已知能过的一档，用来确认「失败是版本问题，不是探针本身坏了」
          - kotlin: "2.4.20"
            compose: "1.12.0"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle + Kotlin/Native
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.konan
          key: kmp-${{ runner.os }}-k${{ matrix.kotlin }}-c${{ matrix.compose }}
          restore-keys: kmp-${{ runner.os }}-

      # 两个 target 都编：只编模拟器会漏掉真机 arm64 才暴露的问题，反之亦然
      - name: Compile iosArm64 + iosSimulatorArm64
        working-directory: ios-probe
        run: |
          ../gradlew compileKotlinIosArm64 compileKotlinIosSimulatorArm64 \
            --no-daemon --stacktrace \
            -PkotlinVersion=${{ matrix.kotlin }} -PcomposeVersion=${{ matrix.compose }}

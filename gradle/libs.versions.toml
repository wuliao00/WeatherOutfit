[versions]
agp = "8.7.3"
# Kotlin/KSP/Compose BOM 三者必须同代：Haze 1.6 依赖 Compose 1.8 + kotlin-stdlib 2.1，
# 只升 Haze 不升 Kotlin 会出现「二进制元数据版本高于编译器」的硬错误。
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.10.1"
composeBom = "2025.06.01"
# Compose Multiplatform：1.8.2 对应的正是 Jetpack Compose 1.8.x，与 app 现在的
# composeBom 2025.06.01（= Compose 1.8.3）同代。CI 已实测 Kotlin 2.1.0 + CMP 1.8.2
# 能编 iOS，所以这里不需要动 Kotlin / AGP / compileSdk。
composeMp = "1.8.2"
navigationCompose = "2.8.5"
room = "2.6.1"
# Gson 已从主代码彻底移除；仅测试还在用 —— 对拍测试拿它当"参照实现"，
# 钉住 kotlinx.serialization 与旧版解析行为逐字段一致、落盘格式双向兼容
gson = "2.10.1"
# KMP 网络层：Ktor 3.0.3 是 Kotlin 2.1 时代发布的版本。
# 刻意不追最新（3.6.0）—— 之前吃过一次「依赖制品的 Kotlin 元数据版本高于编译器」的硬错误，
# 换库时宁可挑与当前 Kotlin 同代的那一档。
ktor = "3.0.3"
kotlinxSerialization = "1.7.3"
# coroutines 与 ktor 3.0.3 传递依赖的版本保持一致，避免双版本
kotlinxCoroutines = "1.9.0"
# Coil3（多平台图片加载）。刻意停在 3.0.4：它编在 Kotlin 2.0.21 上，
# 元数据比我们的 2.1.0 编译器旧；3.1.0 起是 2.1.10，3.2+ 是 2.2，
# 后者会触发「库的元数据比编译器新」硬错误（本项目在 Haze 上吃过同款）。
coil3 = "3.0.4"
datastore = "1.1.1"
work = "2.9.1"
playServicesLocation = "21.3.0"
junit = "4.13.2"
# 液态玻璃：Compose 真实背景模糊（backdrop blur），Android 12+ 走 RenderEffect，低版本自动降级
haze = "1.6.10"
# 启动屏：与风景背景衔接，消除冷启动白/黑闪
splashscreen = "1.0.1"

[libraries]
# AndroidX 基础
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
# 多平台 ViewModel：androidx 2.8 起 lifecycle-viewmodel 本身带 iOS 产物
# （包名仍是 androidx.lifecycle，viewModelScope 也在 commonMain 里），shared 直接用它。
# savedstate 没有 iOS 产物，所以导航参数由 app 侧取出后以 String 传给 VM。
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose（使用 BOM 统一版本）
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }

# 液态玻璃（背景模糊）
haze-core = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }
haze-materials = { group = "dev.chrisbanes.haze", name = "haze-materials", version.ref = "haze" }

# 启动屏
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }

# 导航
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# 本地存储：Room + DataStore
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# 后台任务：每日推送（WorkManager 持久化，重启后自动恢复）
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# 网络层（shared 模块）：core + JSON 协商放 commonMain，引擎按平台放各自 source set
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-serialization = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { group = "io.ktor", name = "ktor-client-darwin", version.ref = "ktor" }

# 图片加载
# 图片加载：Coil3 多平台版。compose 是 AsyncImage，network-okhttp 是 Android 引擎
# （Coil3 不再自带网络栈，不加引擎网络图会静默空白）
coil3-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil3" }
coil3-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil3" }

# JSON：仅测试用（对拍参照实现），主代码一律 kotlinx-serialization-json
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

# 定位（Google Play Services）
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }

# 测试
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMp" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

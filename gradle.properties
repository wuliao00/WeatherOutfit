# Gradle 守护进程内存配置
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# AndroidX 支持库
android.useAndroidX=true
# 每个 module 仅生成自身资源的 R 类，加快编译
android.nonTransitiveRClass=true
# Kotlin 官方代码风格
kotlin.code.style=official
# Kotlin/Native 预置包：关掉 2.1 的新 toolchain，用老路径装进 ~/.konan。
# 开着的时候预置包是按 maven 制品解析的，在 CI（macOS runner）与任何第一次
# clone 这个仓库的机器上都**静默解析不到东西**——~/.konan 根本不会被创建，
# 然后 K/N 编译器在 KotlinNativeToolRunner.runInProcess 里反射加载
# org.jetbrains.kotlin.cli.utilities.MainKt 就抛 ClassNotFoundException，
# 报错长得像"代码编不过"，其实是一行安装都没发生。
# 关掉之后日志里能正常看到：
#   Please wait while Kotlin/Native compiler 2.1.0 is being installed.
#   Unpack Kotlin/Native compiler to ~/.konan/kotlin-native-prebuilt-macos-aarch64-2.1.0
# 证据链：run 36127642271 / 36128802693 / 36130854067（红，含构建后 ~/.konan 不存在的诊断输出）
# → run 36131756538（绿，含上面两行安装日志 + 模拟器测试真跑）。
# 只影响 Kotlin/Native；Android 侧不读它。
kotlin.native.toolchain.enabled=false
